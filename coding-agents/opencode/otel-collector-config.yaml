# OpenTelemetry Collector (otelcol-contrib 0.116.1) — the in-container telemetry
# sidecar. It is started at container boot by /app/entrypoint.sh, BEFORE the agent
# CLI runs, so it holds the Runtime EXECUTION-ROLE credentials (not a shell
# session's). Agents emit UNSIGNED OTLP to 127.0.0.1:4318; the collector re-signs
# every outbound AWS request with SigV4 and fans the signals out three ways:
#
#   logs    -> CloudWatch Logs  /workshop/coding-agents/telemetry  (awscloudwatchlogs)
#   traces  -> X-Ray Transaction Search -> aws/spans log group     (otlphttp + sigv4auth)
#   metrics -> CloudWatch EMF   namespace Workshop/CodingAgents     (awsemf)
#           -> CloudWatch OTLP metrics, which feed GenAI Observability >
#              Coding Agent Insights                          (otlphttp + sigv4auth)
#
# The log group and X-Ray Transaction Search are pre-created by the workshop
# CloudFormation stack; this collector only writes to them. Region and the log
# stream name are read from the Runtime environment (AWS_REGION, WORKSHOP_AGENT_NAME).

extensions:
  # Liveness probe the content curls: `curl -fsS http://127.0.0.1:13133` returns
  # {"status":"Server available", ...} once the collector is up.
  health_check:
    endpoint: 0.0.0.0:13133
  # SigV4 signer for the AWS OTLP (X-Ray) endpoint. Uses the default AWS credential
  # chain, which at boot resolves to the Runtime execution role.
  sigv4auth:
    region: "${env:AWS_REGION:-us-west-2}"
    service: "xray"
  # The CloudWatch OTLP metrics endpoint signs as the "monitoring" service and
  # needs cloudwatch:PutMetricData, which the execution role already grants.
  sigv4auth/metrics:
    region: "${env:AWS_REGION:-us-west-2}"
    service: "monitoring"

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch/traces:
    timeout: 5s
  batch/metrics:
    timeout: 60s
  batch/logs:
    timeout: 5s
  # Coding Agent Insights groups usage by the user.email RESOURCE attribute. The
  # dispatch labels a signed-in submitter as user.id (its email, else its subject
  # ID), so copy an email-shaped user.id to user.email. Unlabeled requests stay
  # unlabeled; nothing is invented.
  transform/insights:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - 'set(attributes["user.email"], attributes["user.id"]) where attributes["user.email"] == nil and attributes["user.id"] != nil and IsMatch(attributes["user.id"], "^[^@ ]+@[^@ ]+$")'

exporters:
  # Logs -> CloudWatch Logs. Stream = WORKSHOP_AGENT_NAME (claude_code / opencode).
  awscloudwatchlogs:
    region: "${env:AWS_REGION:-us-west-2}"
    log_group_name: "/workshop/coding-agents/telemetry"
    log_stream_name: "${env:WORKSHOP_AGENT_NAME:-agent}"
  # Traces -> X-Ray Transaction Search (OTLP ingestion). SigV4-signed; spans land
  # in the aws/spans CloudWatch log group when Transaction Search is enabled.
  otlphttp/xray:
    endpoint: "https://xray.${env:AWS_REGION:-us-west-2}.amazonaws.com"
    auth:
      authenticator: sigv4auth
    compression: none
  # Metrics -> CloudWatch via EMF, namespace Workshop/CodingAgents.
  awsemf:
    # Resource attributes (user.id, run.id, agent.id -- set by the dispatch via
    # OTEL_RESOURCE_ATTRIBUTES) are RESOURCE-level, and the EMF exporter drops
    # resource attributes unless this is on. Without it the metrics in this
    # namespace cannot be sliced by user at all, so per-user cost is invisible
    # in CloudWatch Metrics even though the Logs path is correctly tagged.
    resource_to_telemetry_conversion:
      enabled: true
    region: "${env:AWS_REGION:-us-west-2}"
    namespace: "Workshop/CodingAgents"
    log_group_name: "/workshop/coding-agents/metrics"
    log_stream_name: "${env:WORKSHOP_AGENT_NAME:-agent}"
  # Metrics -> the CloudWatch native OTLP metrics endpoint, queryable with PromQL
  # and shown under GenAI Observability > Coding Agent Insights.
  otlphttp/cloudwatch-metrics:
    metrics_endpoint: "https://monitoring.${env:AWS_REGION:-us-west-2}.amazonaws.com/v1/metrics"
    auth:
      authenticator: sigv4auth/metrics

service:
  extensions: [health_check, sigv4auth, sigv4auth/metrics]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch/logs]
      exporters: [awscloudwatchlogs]
    traces:
      receivers: [otlp]
      processors: [batch/traces]
      exporters: [otlphttp/xray]
    metrics:
      receivers: [otlp]
      processors: [transform/insights, batch/metrics]
      exporters: [awsemf, otlphttp/cloudwatch-metrics]
  telemetry:
    logs:
      level: warn
